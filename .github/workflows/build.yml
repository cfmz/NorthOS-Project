name: Build NorthOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Освобождаем место)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init and Sync
        run: |
          mkdir -p ~/android/north && cd ~/android/north
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/manifest/default.xml .repo/local_manifests/north.xml
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Build
        run: |
          cd ~/android/north
          # Проверка, что движок скачался
          if [ ! -f build/envsetup.sh ]; then
            echo "ОШИБКА: build/envsetup.sh не найден! repo sync не скачал базу."
            exit 1
          fi
          source build/envsetup.sh
          lunch north_lancelot-userdebug
          make -j4 otapackage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthOS-ota
          path: ~/android/north/out/target/product/lancelot/*.zip
