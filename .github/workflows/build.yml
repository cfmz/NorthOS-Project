name: Build NorthOS (lancelot)
on:
  workflow_dispatch:

env:
  DEVICE: lancelot
  LUNCH_TARGET: north_lancelot-userdebug
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check manifest branches exist
        run: |
          fail=0
          while read -r repo branch; do
            if ! git ls-remote --exit-code --heads "https://github.com/${repo}.git" "${branch}" >/dev/null 2>&1; then
              echo "::error::Нет ветки ${branch} в ${repo}"
              fail=1
            fi
          done <<'EOF'
          LineageOS/android lineage-20.0
          LineageOS/android_device_xiaomi_lancelot lineage-20
          LineageOS/android_device_xiaomi_mt6768-common lineage-20
          LineageOS/android_kernel_xiaomi_mt6768 lineage-20
          TheMuppets/proprietary_vendor_xiaomi_lancelot lineage-20
          TheMuppets/proprietary_vendor_xiaomi_mt6768-common lineage-20
          cfmz/NorthOS-Project main
          EOF
          exit $fail

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf \
            python-is-python3 lib32readline-dev lib32z1-dev libdw-dev libelf-dev \
            libgnutls28-dev lz4 libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Repo init
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lineage"
          cd "$GITHUB_WORKSPACE/lineage"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --no-clone-bundle

      - name: Add local manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lineage/.repo/local_manifests"
          cp "$GITHUB_WORKSPACE/manifest/default.xml" "$GITHUB_WORKSPACE/lineage/.repo/local_manifests/north.xml"

      - name: Repo sync
        run: |
          cd "$GITHUB_WORKSPACE/lineage"
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          df -h

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/lineage"
          export LC_ALL=C
          export TZ=UTC
          set +u
          source build/envsetup.sh
          breakfast "$DEVICE"
          lunch "$LUNCH_TARGET"
          make -j4 otapackage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: NorthOS-lancelot
          path: |
            lineage/out/target/product/lancelot/*.zip
            lineage/out/target/product/lancelot/boot.img
            lineage/out/target/product/lancelot/vendor_boot.img
            lineage/out/target/product/lancelot/dtbo.img
          if-no-files-found: error
